server {
    listen 443 ssl http2;
    server_name jibitab.ir;

    ssl_certificate /etc/letsencrypt/live/jibitab.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jibitab.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # ACME challenge (still needed for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=(), camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /favicon.ico {
        return 301 /assets/images/icon128.webp;
    }

    location ~ ^/(customization|speed-tips|update-2|idea-story|dark-mode|bookmarks|privacy)$ {
        return 301 /posts/$1;
    }

    location ~ ^/pages/posts/(.+)$ {
        return 301 /posts/$1;
    }

    location = /index {
        return 301 /;
    }

    location ~ ^/(?!index\.html$)(.+)\.html$ {
        return 301 /$1;
    }

    location = /blog {
        try_files /blog.html =404;
    }

    location = /blog/ {
        return 301 /blog;
    }

    location /posts/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name jibitab.ir www.jibitab.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jibitab.ir$request_uri;
    }
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl http2;
    server_name www.jibitab.ir;

    ssl_certificate /etc/letsencrypt/live/jibitab.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jibitab.ir/privkey.pem;

    return 301 https://jibitab.ir$request_uri;
}
