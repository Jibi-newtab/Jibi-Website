<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <title>صفحه پیدا نشد – جیبی</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/webp" href="/assets/images/icon128.webp">
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/iranyekanx-regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/iranyekanx-bold.woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/iranyekan.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .nf-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
        }
        .nf-code {
            font-size: clamp(80px, 18vw, 160px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #5B5EFF, #FF5C8D);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .nf-title {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        .nf-text {
            font-size: 16px;
            color: var(--text-mid);
            max-width: 480px;
            margin: 0 auto 32px;
            line-height: 1.8;
        }
        .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
<main class="nf-wrap">
    <div class="nf-code">۴۰۴</div>
    <h1 class="nf-title">این صفحه پیدا نشد</h1>
    <p class="nf-text">آدرسی که وارد کردی اشتباهه یا صفحه پاک شده. می‌تونی برگردی به خونه یا یه نگاه به بلاگ بندازی.</p>
    <div class="nf-actions">
        <a href="/" class="btn-primary">برگشت به خانه</a>
        <a href="/blog.html" class="btn-primary" style="background: var(--bg-mid); color: var(--text); box-shadow: none;">رفتن به بلاگ</a>
    </div>
</main>
</body>
</html>
